<div class="container content">
        <div class="col-md-6 offset-md-3">
            <span class="anchor" id="formLogin"></span>
            <div class="card card-outline-secondary">
                <div class="card-header">
                    <h3 class="mb-0">listado</h3>
                </div>
                <div class="card-body">
                    <app-form-computadora (onItemAdded)="agregado($event)"></app-form-computadora>
                </div>
            </div>
        </div>
    <hr class="mb-5">
    <ul class="row">
        <app-computadora *ngFor="let c of computadoraApiClient.getAll() let i=index" 
        [computadora]="c"
        [position]="i+1"
        [idx]="i+1"
        (clicked)="elegir($event)"
        ></app-computadora>
    </ul>
    <hr class="mb-5">
    <div class="row row-flex">
        <h5>Actividades</h5>
        <ul>
            <li *ngFor="let u of updates;">{{u}}</li>
        </ul>
    </div>
</div>
